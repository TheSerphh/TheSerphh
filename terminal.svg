<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">

<style>
.bg {
  fill: #1d2021;
}

.window {
  fill: #282828;
  stroke: #504945;
  stroke-width: 2;
}

.topbar {
  fill: #3c3836;
}

.title {
  fill: #ebdbb2;
  font-family: monospace;
  font-size: 20px;
}

.prompt {
  fill: #b8bb26;
  font-family: monospace;
  font-size: 28px;
}

.command {
  fill: #fabd2f;
  font-family: monospace;
  font-size: 28px;
}

.label {
  fill: #83a598;
  font-family: monospace;
  font-size: 26px;
}

.value {
  fill: #ebdbb2;
  font-family: monospace;
  font-size: 26px;
}

.dim {
  fill: #a89984;
  font-family: monospace;
  font-size: 26px;
}

.orange {
  fill: #fe8019;
  font-family: monospace;
  font-size: 28px;
}

.link {
  fill: #83a598;
  font-family: monospace;
  font-size: 24px;
  text-decoration: underline;
  cursor: pointer;
}

.link:hover {
  fill: #fabd2f;
}

.cursor {
  fill: #fabd2f;
  animation: blink 1s steps(1) infinite;
}

@keyframes blink {
  50% { opacity: 0; }
}
</style>

<!-- Background -->
<rect width="1200" height="700" class="bg"/>

<!-- Terminal Window -->
<rect x="60" y="45" width="1080" height="610" rx="18" class="window"/>

<!-- Topbar -->
<rect x="60" y="45" width="1080" height="52" rx="18" class="topbar"/>
<rect x="60" y="83" width="1080" height="14" class="topbar"/>

<!-- Topbar Buttons -->
<circle cx="95" cy="71" r="8" fill="#fb4934"/>
<circle cx="125" cy="71" r="8" fill="#fabd2f"/>
<circle cx="155" cy="71" r="8" fill="#b8bb26"/>

<!-- Title -->
<text x="220" y="78" class="title">sourav@archlinux: ~/profile</text>

<!-- Line 1 -->
<text x="90" y="155" class="prompt">sourav@archlinux:~$</text>
<text x="520" y="155" class="command">whoami</text>

<!-- Output -->
<text x="90" y="210" class="value">Sourav (TheSerphh)</text>

<!-- Line 2 -->
<text x="90" y="290" class="prompt">sourav@archlinux:~$</text>
<text x="520" y="290" class="command">fetch_profile</text>

<!-- Profile Info -->
<text x="90" y="365" class="label">Username</text>
<text x="340" y="365" class="dim">:</text>
<text x="390" y="365" class="value">@TheSerphh</text>

<text x="90" y="420" class="label">Role</text>
<text x="340" y="420" class="dim">:</text>
<text x="390" y="420" class="value">Open-source Developer</text>

<text x="90" y="475" class="label">Focus</text>
<text x="340" y="475" class="dim">:</text>
<text x="390" y="475" class="value">Linux • C/C++ • Android • KDE</text>

<!-- Contact Section -->
<text x="90" y="545" class="label">Contact</text>
<text x="340" y="545" class="dim">:</text>

<!-- Clickable Links -->
<a href="https://github.com/TheSerphh" target="_blank">
  <text x="390" y="545" class="link">github.com/TheSerphh</text>
</a>

<a href="https://twitter.com/TheSerphh" target="_blank">
  <text x="780" y="545" class="link">twitter.com/TheSerphh</text>
</a>

<a href="mailto:sourav@example.com" target="_blank">
  <text x="390" y="580" class="link">sourav@example.com</text>
</a>

<a href="https://linkedin.com/in/TheSerphh" target="_blank">
  <text x="780" y="580" class="link">linkedin.com/in/TheSerphh</text>
</a>

<!-- Bottom Prompt -->
<text x="90" y="620" class="orange">sourav@archlinux:~$</text>

<!-- Cursor -->
<rect x="520" y="598" width="18" height="30" rx="2" class="cursor"/>

</svg>
