<svg width="800" height="480" viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">

<style>
.bg {
  fill: #1d2021;
}

.window {
  fill: #282828;
  stroke: #504945;
  stroke-width: 2;
}

.topbar {
  fill: #3c3836;
}

.title {
  fill: #ebdbb2;
  font-family: "Courier New", monospace;
  font-size: 14px;
}

.prompt {
  fill: #b8bb26;
  font-family: "Courier New", monospace;
  font-size: 18px;
  font-weight: bold;
}

.command {
  fill: #fabd2f;
  font-family: "Courier New", monospace;
  font-size: 18px;
}

.label {
  fill: #83a598;
  font-family: "Courier New", monospace;
  font-size: 16px;
}

.value {
  fill: #ebdbb2;
  font-family: "Courier New", monospace;
  font-size: 16px;
}

.dim {
  fill: #a89984;
  font-family: "Courier New", monospace;
  font-size: 16px;
}

.orange {
  fill: #fe8019;
  font-family: "Courier New", monospace;
  font-size: 18px;
  font-weight: bold;
}

.cursor {
  fill: #fabd2f;
  animation: blink 1s steps(1) infinite;
}

@keyframes blink {
  50% { opacity: 0; }
}
</style>

<!-- Background -->
<rect width="800" height="480" class="bg"/>

<!-- Terminal Window -->
<rect x="40" y="30" width="720" height="420" rx="12" class="window"/>

<!-- Topbar -->
<rect x="40" y="30" width="720" height="36" rx="12" class="topbar"/>
<rect x="40" y="56" width="720" height="10" class="topbar"/>

<!-- Topbar Buttons -->
<circle cx="65" cy="49" r="6" fill="#fb4934"/>
<circle cx="85" cy="49" r="6" fill="#fabd2f"/>
<circle cx="105" cy="49" r="6" fill="#b8bb26"/>

<!-- Title -->
<text x="150" y="54" class="title">sourav@archlinux: ~/profile</text>

<!-- Line 1: whoami -->
<text x="65" y="105" class="prompt">$</text>
<text x="115" y="105" class="command">whoami</text>

<!-- Output 1 -->
<text x="65" y="140" class="value">  Sourav (@TheSerphh)</text>

<!-- Line 2: fetch_profile -->
<text x="65" y="195" class="prompt">$</text>
<text x="115" y="195" class="command">fetch_profile</text>

<!-- Profile Info with tree-style formatting -->
<text x="80" y="245" class="label">├── username</text>
<text x="320" y="245" class="dim">→</text>
<text x="355" y="245" class="value">@TheSerphh</text>

<text x="80" y="280" class="label">├── role</text>
<text x="320" y="280" class="dim">→</text>
<text x="355" y="280" class="value">Open-source Developer</text>

<text x="80" y="315" class="label">├── focus</text>
<text x="320" y="315" class="dim">→</text>
<text x="355" y="315" class="value">Linux • C/C++ • Android • KDE</text>

<text x="80" y="350" class="label">└── status</text>
<text x="320" y="350" class="dim">→</text>
<text x="355" y="350" class="value">Preparing for FAANG &amp; GATE</text>

<!-- Bottom Prompt -->
<text x="65" y="420" class="orange">sourav@archlinux:~$</text>

<!-- Cursor -->
<rect x="375" y="404" width="12" height="20" rx="2" class="cursor"/>

</svg>
