<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">

<style>
.bg {
  fill: #1d2021;
}

.window {
  fill: #282828;
  stroke: #504945;
  stroke-width: 2;
}

.topbar {
  fill: #3c3836;
}

.title {
  fill: #ebdbb2;
  font-family: "Courier New", monospace;
  font-size: 20px;
}

.prompt {
  fill: #b8bb26;
  font-family: "Courier New", monospace;
  font-size: 28px;
  font-weight: bold;
}

.command {
  fill: #fabd2f;
  font-family: "Courier New", monospace;
  font-size: 28px;
}

.label {
  fill: #83a598;
  font-family: "Courier New", monospace;
  font-size: 26px;
}

.value {
  fill: #ebdbb2;
  font-family: "Courier New", monospace;
  font-size: 26px;
}

.dim {
  fill: #a89984;
  font-family: "Courier New", monospace;
  font-size: 26px;
}

.orange {
  fill: #fe8019;
  font-family: "Courier New", monospace;
  font-size: 28px;
  font-weight: bold;
}

.cursor {
  fill: #fabd2f;
  animation: blink 1s steps(1) infinite;
}

@keyframes blink {
  50% { opacity: 0; }
}
</style>

<!-- Background -->
<rect width="1200" height="700" class="bg"/>

<!-- Terminal Window -->
<rect x="60" y="45" width="1080" height="610" rx="18" class="window"/>

<!-- Topbar -->
<rect x="60" y="45" width="1080" height="52" rx="18" class="topbar"/>
<rect x="60" y="83" width="1080" height="14" class="topbar"/>

<!-- Topbar Buttons -->
<circle cx="95" cy="71" r="8" fill="#fb4934"/>
<circle cx="125" cy="71" r="8" fill="#fabd2f"/>
<circle cx="155" cy="71" r="8" fill="#b8bb26"/>

<!-- Title -->
<text x="220" y="78" class="title">sourav@archlinux: ~/profile</text>

<!-- Line 1: whoami -->
<text x="90" y="155" class="prompt">$</text>
<text x="160" y="155" class="command">whoami</text>

<!-- Output 1 -->
<text x="90" y="210" class="value">  Sourav (@TheSerphh)</text>

<!-- Line 2: fetch_profile -->
<text x="90" y="290" class="prompt">$</text>
<text x="160" y="290" class="command">fetch_profile</text>

<!-- Profile Info with tree-style formatting -->
<text x="110" y="365" class="label">├── username</text>
<text x="460" y="365" class="dim">→</text>
<text x="510" y="365" class="value">@TheSerphh</text>

<text x="110" y="420" class="label">├── role</text>
<text x="460" y="420" class="dim">→</text>
<text x="510" y="420" class="value">Open-source Developer</text>

<text x="110" y="475" class="label">├── focus</text>
<text x="460" y="475" class="dim">→</text>
<text x="510" y="475" class="value">Linux • C/C++ • Android • KDE</text>

<text x="110" y="530" class="label">└── status</text>
<text x="460" y="530" class="dim">→</text>
<text x="510" y="530" class="value">Preparing for FAANG &amp; GATE</text>

<!-- Bottom Prompt -->
<text x="90" y="620" class="orange">sourav@archlinux:~$</text>

<!-- Cursor -->
<rect x="530" y="598" width="18" height="30" rx="2" class="cursor"/>

</svg>
