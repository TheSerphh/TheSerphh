<svg width="1000" height="640" viewBox="0 0 1000 640" fill="none" xmlns="http://www.w3.org/2000/svg">

<style>
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap');

.background {
  fill: #0d1117;
}

.terminal {
  fill: #161b22;
  stroke: #30363d;
  stroke-width: 2;
}

.header {
  fill: #21262d;
}

.title {
  fill: #c9d1d9;
  font-family: 'Fira Code', monospace;
  font-size: 18px;
}

.text {
  fill: #58a6ff;
  font-family: 'Fira Code', monospace;
  font-size: 20px;
}

.green {
  fill: #3fb950;
  font-family: 'Fira Code', monospace;
  font-size: 20px;
}

.white {
  fill: #c9d1d9;
  font-family: 'Fira Code', monospace;
  font-size: 20px;
}

.gray {
  fill: #8b949e;
  font-family: 'Fira Code', monospace;
  font-size: 20px;
}

.cursor {
  fill: #58a6ff;
  animation: blink 1s infinite;
}

.linkbox {
  fill: #161b22;
  stroke: #30363d;
  stroke-width: 1.5;
  transition: 0.3s;
}

.linktext {
  fill: #c9d1d9;
  font-family: 'Fira Code', monospace;
  font-size: 16px;
}

@keyframes blink {
  0%, 50% { opacity: 1; }
  51%, 100% { opacity: 0; }
}

.typing1 {
  animation: typing1 4s steps(40) infinite;
}

.typing2 {
  animation: typing2 4s steps(40) infinite;
}

@keyframes typing1 {
  0% { opacity: 0; }
  15% { opacity: 1; }
  100% { opacity: 1; }
}

@keyframes typing2 {
  0%, 40% { opacity: 0; }
  55% { opacity: 1; }
  100% { opacity: 1; }
}
</style>

<!-- BACKGROUND -->
<rect width="1000" height="640" class="background"/>

<!-- TERMINAL -->
<rect x="60" y="40" width="880" height="470" rx="14" class="terminal"/>

<!-- HEADER -->
<rect x="60" y="40" width="880" height="45" rx="14" class="header"/>

<!-- BUTTONS -->
<circle cx="90" cy="63" r="7" fill="#ff5f56"/>
<circle cx="115" cy="63" r="7" fill="#ffbd2e"/>
<circle cx="140" cy="63" r="7" fill="#27c93f"/>

<!-- TITLE -->
<text x="180" y="69" class="title">sourav@github: ~</text>

<!-- CONTENT -->
<text x="90" y="130" class="green typing1">$ whoami</text>
<text x="260" y="130" class="white typing1">Sourav</text>

<text x="90" y="180" class="green typing1">$ fetch_profile</text>

<text x="90" y="230" class="text typing2">Username  :</text>
<text x="310" y="230" class="white typing2">@TheSerphh</text>

<text x="90" y="270" class="text typing2">Role      :</text>
<text x="310" y="270" class="white typing2">Open-source Developer</text>

<text x="90" y="310" class="text typing2">Focus     :</text>
<text x="310" y="310" class="white typing2">Linux • C/C++ • Android • KDE</text>

<text x="90" y="370" class="green">$ current_status</text>

<text x="90" y="420" class="gray">
Preparing for FAANG and GATE while building open-source tooling.
</text>

<!-- CURSOR -->
<rect x="820" y="405" width="12" height="24" class="cursor"/>

<!-- LINKS SECTION -->

<!-- GITHUB -->
<a href="https://github.com/TheSerphh" target="_blank">
  <rect x="140" y="550" width="220" height="50" rx="10" class="linkbox"/>
  
  <circle cx="170" cy="575" r="12" fill="#ffffff"/>
  
  <text x="195" y="582" class="linktext">GitHub</text>
</a>

<!-- LINKEDIN -->
<a href="https://linkedin.com" target="_blank">
  <rect x="390" y="550" width="220" height="50" rx="10" class="linkbox"/>
  
  <rect x="415" y="563" width="20" height="20" fill="#0A66C2"/>
  
  <text x="450" y="582" class="linktext">LinkedIn</text>
</a>

<!-- WEBSITE -->
<a href="https://theglitchh.github.io" target="_blank">
  <rect x="640" y="550" width="220" height="50" rx="10" class="linkbox"/>
  
  <circle cx="670" cy="575" r="11" fill="#58a6ff"/>
  
  <text x="695" y="582" class="linktext">Website</text>
</a>

</svg>
